# YOLO26n-P2 with a single bidirectional, weighted P2-P5 BiFPN cell.
# Custom fusion/refinement layers are registered by src.modules.bifpn_src.
nc: 2  # fire, smoke
end2end: True
reg_max: 1
scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]           # 0 P1/2
  - [-1, 1, Conv, [128, 3, 2]]          # 1 P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]   # 2 P2
  - [-1, 1, Conv, [256, 3, 2]]          # 3 P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]   # 4 P3
  - [-1, 1, Conv, [512, 3, 2]]          # 5 P4/16
  - [-1, 2, C3k2, [512, True]]          # 6 P4
  - [-1, 1, Conv, [1024, 3, 2]]         # 7 P5/32
  - [-1, 2, C3k2, [1024, True]]         # 8
  - [-1, 1, SPPF, [1024, 5, 3, True]]   # 9
  - [-1, 2, C2PSA, [1024]]              # 10 P5

head:
  # At scale n, the four lateral projections and all BiFPN nodes have 64 channels.
  - [2, 1, Conv, [256, 1, 1]]   # 11 P2 lateral
  - [4, 1, Conv, [256, 1, 1]]   # 12 P3 lateral
  - [6, 1, Conv, [256, 1, 1]]   # 13 P4 lateral
  - [10, 1, Conv, [256, 1, 1]]  # 14 P5 lateral

  # Top-down P5 -> P4 -> P3 -> P2. Index restores parser channel bookkeeping.
  - [14, 1, nn.Upsample, [None, 2, nearest]]  # 15
  - [[15, 13], 1, Concat, [1]]                 # 16
  - [-1, 1, WeightedBiFPNFusion, [64, 2]]     # 17
  - [-1, 1, Index, [64, 0]]                    # 18
  - [-1, 1, BiFPNRefine, [64]]                 # 19 P4 top-down

  - [19, 1, nn.Upsample, [None, 2, nearest]]  # 20
  - [[20, 12], 1, Concat, [1]]                 # 21
  - [-1, 1, WeightedBiFPNFusion, [64, 2]]     # 22
  - [-1, 1, Index, [64, 0]]                    # 23
  - [-1, 1, BiFPNRefine, [64]]                 # 24 P3 top-down

  - [24, 1, nn.Upsample, [None, 2, nearest]]  # 25
  - [[25, 11], 1, Concat, [1]]                 # 26
  - [-1, 1, WeightedBiFPNFusion, [64, 2]]     # 27
  - [-1, 1, Index, [64, 0]]                    # 28
  - [-1, 1, BiFPNRefine, [64]]                 # 29 P2 top-down

  # Bottom-up P2 -> P3 -> P4 -> P5, with same-level lateral inputs.
  - [29, 1, nn.MaxPool2d, [2, 2]]             # 30
  - [[30, 24, 12], 1, Concat, [1]]             # 31
  - [-1, 1, WeightedBiFPNFusion, [64, 3]]     # 32
  - [-1, 1, Index, [64, 0]]                    # 33
  - [-1, 1, BiFPNRefine, [64]]                 # 34 P3 bottom-up

  - [34, 1, nn.MaxPool2d, [2, 2]]             # 35
  - [[35, 19, 13], 1, Concat, [1]]             # 36
  - [-1, 1, WeightedBiFPNFusion, [64, 3]]     # 37
  - [-1, 1, Index, [64, 0]]                    # 38
  - [-1, 1, BiFPNRefine, [64]]                 # 39 P4 bottom-up

  - [39, 1, nn.MaxPool2d, [2, 2]]             # 40
  - [[40, 14], 1, Concat, [1]]                 # 41
  - [-1, 1, WeightedBiFPNFusion, [64, 2]]     # 42
  - [-1, 1, Index, [64, 0]]                    # 43
  - [-1, 1, BiFPNRefine, [64]]                 # 44 P5 bottom-up

  - [[29, 34, 39, 44], 1, Detect, [nc]]       # 45 P2, P3, P4, P5
