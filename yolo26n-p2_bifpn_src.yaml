# YOLO26n backbone with spatial-relational attention and a one-pass P2-P5 BiFPN.
# This project-specific architecture does not modify the installed stock YOLO26 model.
nc: 2  # fire, smoke
end2end: True
reg_max: 1
scales:
  n: [0.50, 0.25, 1024]

# Custom layers are registered by src.modules.bifpn_src before YOLO loads this YAML.
# At scale n, Conv [256, ...] produces 64 channels. Attention/Refine/Index
# arguments use actual channels because the parser does not scale custom layers.
backbone:
  - [-1, 1, Conv, [64, 3, 2]]           # 0  P1/2
  - [-1, 1, Conv, [128, 3, 2]]          # 1  P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]   # 2  P2, 64 channels
  - [-1, 1, Conv, [256, 3, 2]]          # 3  P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]   # 4  P3, 128 channels
  - [-1, 1, Conv, [512, 3, 2]]          # 5  P4/16
  - [-1, 2, C3k2, [512, True]]          # 6  P4, 128 channels
  - [-1, 1, Conv, [1024, 3, 2]]         # 7  P5/32
  - [-1, 2, C3k2, [1024, True]]         # 8
  - [-1, 1, SPPF, [1024, 5, 3, True]]   # 9
  - [-1, 2, C2PSA, [1024]]              # 10 P5, 256 channels

  # Side taps keep the original YOLO26n backbone indices 0-10 for weight transfer.
  - [2, 1, SpatialRelationalCoAttentionLite, [64, 8, 8]]   # 11 P2 detail
  - [6, 1, SpatialRelationalCoAttentionLite, [128, 8, 8]]  # 12 P4 context

head:
  # Channel-aligned lateral inputs to the BiFPN (64 channels each).
  - [11, 1, Conv, [256, 1, 1]]  # 13 P2
  - [4, 1, Conv, [256, 1, 1]]   # 14 P3
  - [12, 1, Conv, [256, 1, 1]]  # 15 P4
  - [10, 1, Conv, [256, 1, 1]]  # 16 P5

  # Top-down path: P5 -> P4 -> P3 -> P2.
  # Concat is followed by a normalized weighted sum. Fusion returns a
  # one-item tuple; Index restores the fused 64-channel count in the parser.
  - [16, 1, nn.Upsample, [None, 2, nearest]]      # 17 P5 -> P4
  - [[17, 15], 1, Concat, [1]]                     # 18
  - [-1, 1, WeightedBiFPNFusion, [64, 2]]         # 19
  - [-1, 1, Index, [64, 0]]                        # 20
  - [-1, 1, BiFPNRefine, [64]]                     # 21 P4 top-down

  - [21, 1, nn.Upsample, [None, 2, nearest]]      # 22 P4 -> P3
  - [[22, 14], 1, Concat, [1]]                     # 23
  - [-1, 1, WeightedBiFPNFusion, [64, 2]]         # 24
  - [-1, 1, Index, [64, 0]]                        # 25
  - [-1, 1, BiFPNRefine, [64]]                     # 26 P3 top-down

  - [26, 1, nn.Upsample, [None, 2, nearest]]      # 27 P3 -> P2
  - [[27, 13], 1, Concat, [1]]                     # 28
  - [-1, 1, WeightedBiFPNFusion, [64, 2]]         # 29
  - [-1, 1, Index, [64, 0]]                        # 30
  - [-1, 1, BiFPNRefine, [64]]                     # 31 P2 top-down
  - [-1, 1, SpatialRelationalCoAttentionLite, [64, 8, 8]]  # 32 P2/4

  # Bottom-up path: P2 -> P3 -> P4 -> P5.
  - [32, 1, nn.MaxPool2d, [2, 2]]                 # 33 P2 -> P3
  - [[33, 26, 14], 1, Concat, [1]]                 # 34
  - [-1, 1, WeightedBiFPNFusion, [64, 3]]         # 35
  - [-1, 1, Index, [64, 0]]                        # 36
  - [-1, 1, BiFPNRefine, [64]]                     # 37 P3/8

  - [37, 1, nn.MaxPool2d, [2, 2]]                 # 38 P3 -> P4
  - [[38, 21, 15], 1, Concat, [1]]                 # 39
  - [-1, 1, WeightedBiFPNFusion, [64, 3]]         # 40
  - [-1, 1, Index, [64, 0]]                        # 41
  - [-1, 1, BiFPNRefine, [64]]                     # 42 P4 bottom-up
  - [-1, 1, SpatialRelationalCoAttentionLite, [64, 8, 8]]  # 43 P4/16

  - [43, 1, nn.MaxPool2d, [2, 2]]                 # 44 P4 -> P5
  - [[44, 16], 1, Concat, [1]]                     # 45
  - [-1, 1, WeightedBiFPNFusion, [64, 2]]         # 46
  - [-1, 1, Index, [64, 0]]                        # 47
  - [-1, 1, BiFPNRefine, [64]]                     # 48 P5/32

  - [[32, 37, 43, 48], 1, Detect, [nc]]           # 49 P2, P3, P4, P5
