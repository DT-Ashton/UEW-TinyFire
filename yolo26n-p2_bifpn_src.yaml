# Unmodified YOLO26n backbone with neck-only spatial-relational attention and P2-P5 BiFPN.
# This project-specific architecture does not modify the installed stock YOLO26 model.
nc: 2  # fire, smoke
end2end: True
reg_max: 1
scales:
  n: [0.50, 0.25, 1024]

# Custom layers are registered by src.modules.bifpn_src before YOLO loads this YAML.
# At scale n, Conv [256, ...] produces 64 channels. Attention/Refine/Index
# arguments use actual channels because the parser does not scale custom layers.
backbone:
  - [-1, 1, Conv, [64, 3, 2]]           # 0  P1/2
  - [-1, 1, Conv, [128, 3, 2]]          # 1  P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]   # 2  P2, 64 channels
  - [-1, 1, Conv, [256, 3, 2]]          # 3  P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]   # 4  P3, 128 channels
  - [-1, 1, Conv, [512, 3, 2]]          # 5  P4/16
  - [-1, 2, C3k2, [512, True]]          # 6  P4, 128 channels
  - [-1, 1, Conv, [1024, 3, 2]]         # 7  P5/32
  - [-1, 2, C3k2, [1024, True]]         # 8
  - [-1, 1, SPPF, [1024, 5, 3, True]]   # 9
  - [-1, 2, C2PSA, [1024]]              # 10 P5, 256 channels

head:
  # Channel-aligned lateral inputs to the BiFPN (64 channels each).
  - [2, 1, Conv, [256, 1, 1]]   # 11 P2
  - [4, 1, Conv, [256, 1, 1]]   # 12 P3
  - [6, 1, Conv, [256, 1, 1]]   # 13 P4
  - [10, 1, Conv, [256, 1, 1]]  # 14 P5

  # Top-down path: P5 -> P4 -> P3 -> P2.
  # Concat is followed by a normalized weighted sum. Fusion returns a
  # one-item tuple; Index restores the fused 64-channel count in the parser.
  - [14, 1, nn.Upsample, [None, 2, nearest]]      # 15 P5 -> P4
  - [[15, 13], 1, Concat, [1]]                     # 16
  - [-1, 1, WeightedBiFPNFusion, [64, 2]]         # 17
  - [-1, 1, Index, [64, 0]]                        # 18
  - [-1, 1, BiFPNRefine, [64]]                     # 19 P4 top-down

  - [19, 1, nn.Upsample, [None, 2, nearest]]      # 20 P4 -> P3
  - [[20, 12], 1, Concat, [1]]                     # 21
  - [-1, 1, WeightedBiFPNFusion, [64, 2]]         # 22
  - [-1, 1, Index, [64, 0]]                        # 23
  - [-1, 1, BiFPNRefine, [64]]                     # 24 P3 top-down

  - [24, 1, nn.Upsample, [None, 2, nearest]]      # 25 P3 -> P2
  - [[25, 11], 1, Concat, [1]]                     # 26
  - [-1, 1, WeightedBiFPNFusion, [64, 2]]         # 27
  - [-1, 1, Index, [64, 0]]                        # 28
  - [-1, 1, BiFPNRefine, [64]]                     # 29 P2 top-down
  - [-1, 1, SpatialRelationalCoAttentionLite, [64, 8, 8]]  # 30 fused P2/4

  # Bottom-up path: P2 -> P3 -> P4 -> P5.
  - [30, 1, nn.MaxPool2d, [2, 2]]                 # 31 P2 -> P3
  - [[31, 24, 12], 1, Concat, [1]]                 # 32
  - [-1, 1, WeightedBiFPNFusion, [64, 3]]         # 33
  - [-1, 1, Index, [64, 0]]                        # 34
  - [-1, 1, BiFPNRefine, [64]]                     # 35 P3/8

  - [35, 1, nn.MaxPool2d, [2, 2]]                 # 36 P3 -> P4
  - [[36, 19, 13], 1, Concat, [1]]                 # 37
  - [-1, 1, WeightedBiFPNFusion, [64, 3]]         # 38
  - [-1, 1, Index, [64, 0]]                        # 39
  - [-1, 1, BiFPNRefine, [64]]                     # 40 P4 bottom-up
  - [-1, 1, SpatialRelationalCoAttentionLite, [64, 8, 8]]  # 41 fused P4/16

  - [41, 1, nn.MaxPool2d, [2, 2]]                 # 42 P4 -> P5
  - [[42, 14], 1, Concat, [1]]                     # 43
  - [-1, 1, WeightedBiFPNFusion, [64, 2]]         # 44
  - [-1, 1, Index, [64, 0]]                        # 45
  - [-1, 1, BiFPNRefine, [64]]                     # 46 P5/32

  - [[30, 35, 41, 46], 1, Detect, [nc]]           # 47 P2, P3, P4, P5
