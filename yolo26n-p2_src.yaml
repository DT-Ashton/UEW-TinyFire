# YOLO26n-P2 with the stock PAN neck and neck-only fire/smoke co-attention.
# NeckSpatialRelationCoAttention is registered by src.modules.co_attention.
nc: 2  # fire, smoke
end2end: True
reg_max: 1
scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]           # 0 P1/2
  - [-1, 1, Conv, [128, 3, 2]]          # 1 P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]   # 2 P2
  - [-1, 1, Conv, [256, 3, 2]]          # 3 P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]   # 4 P3
  - [-1, 1, Conv, [512, 3, 2]]          # 5 P4/16
  - [-1, 2, C3k2, [512, True]]          # 6 P4
  - [-1, 1, Conv, [1024, 3, 2]]         # 7 P5/32
  - [-1, 2, C3k2, [1024, True]]         # 8
  - [-1, 1, SPPF, [1024, 5, 3, True]]   # 9
  - [-1, 2, C2PSA, [1024]]              # 10 P5

head:
  # Stock YOLO26n-P2 top-down PAN path.
  - [-1, 1, nn.Upsample, [None, 2, nearest]]  # 11
  - [[-1, 6], 1, Concat, [1]]                  # 12
  - [-1, 2, C3k2, [512, True]]                # 13 P4 top-down

  - [-1, 1, nn.Upsample, [None, 2, nearest]]  # 14
  - [[-1, 4], 1, Concat, [1]]                  # 15
  - [-1, 2, C3k2, [256, True]]                # 16 P3 top-down

  - [-1, 1, nn.Upsample, [None, 2, nearest]]  # 17
  - [[-1, 2], 1, Concat, [1]]                  # 18
  - [-1, 2, C3k2, [128, True]]                # 19 P2 top-down
  - [-1, 1, NeckSpatialRelationCoAttention, [32, 32, 4, 8, 1024]]  # 20 P2 SRC

  # Stock YOLO26n-P2 bottom-up PAN path, with SRC after fused P4.
  - [-1, 1, Conv, [128, 3, 2]]               # 21
  - [[-1, 16], 1, Concat, [1]]                # 22
  - [-1, 2, C3k2, [256, True]]               # 23 P3 bottom-up

  - [-1, 1, Conv, [256, 3, 2]]               # 24
  - [[-1, 13], 1, Concat, [1]]                # 25
  - [-1, 2, C3k2, [512, True]]               # 26 P4 bottom-up
  - [-1, 1, NeckSpatialRelationCoAttention, [128, 32, 4, 8, 1024]]  # 27 P4 SRC

  - [-1, 1, Conv, [512, 3, 2]]               # 28
  - [[-1, 10], 1, Concat, [1]]                # 29
  - [-1, 1, C3k2, [1024, True, 0.5, True]]   # 30 P5 bottom-up

  - [[20, 23, 27, 30], 1, Detect, [nc]]      # 31 P2, P3, P4, P5
